<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>TwingoPay - Entrar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: '#A3C68C',
                        olive: '#879676',
                        taupe: '#6E6662',
                        plum: '#4F364A',
                        eggplant: '#340735',
                    }
                }
            }
        }
    </script>
</head>

<body
    class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-sage via-taupe to-eggplant px-4 py-10">
    <h1 class="text-white/70 mb-8 text-center" >Twingopay &mdash; controle financeiro pessoal</h1>
    <img class="max-w-[14rem] mb-8 " src="pork.svg" alt="">

    <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-8">
        <h1 class="text-2xl font-bold text-eggplant text-center mb-6">Seja bem vindo!</h1>

        <form th:action="@{/login}" method="post" class="space-y-5">
            <button type="submit"
                class="w-full bg-eggplant hover:bg-plum text-white font-semibold py-2.5 rounded-md transition-colors">
                <a href="/twingopay/correntistas/login">Já sou cliente</a>
            </button>
            <button type="submit"
                class="w-full bg-eggplant hover:bg-plum text-white font-semibold py-2.5 rounded-md transition-colors">
                <a href="/twingopay/correntistas/form">Quero ser cliente</a>
            </button>
        </form>
    </div>

</body>

</html>
