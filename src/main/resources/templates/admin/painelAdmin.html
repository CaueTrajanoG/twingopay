<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Twingopay - Painel do Administrador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: '#A3C68C',
                        olive: '#879676',
                        taupe: '#6E6662',
                        plum: '#4F364A',
                        eggplant: '#340735',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gray-50">

    <!-- Navbar -->
    <nav class="bg-eggplant text-white px-6 py-4 flex items-center justify-between">
        <a th:href="@{/login}" class="text-lg font-bold tracking-wide hover:text-sage transition-colors">
            Twingopay
        </a>

        <div class="flex items-center gap-4">
            <span class="text-sm text-white/80">
                Olá, <span class="font-semibold text-white" th:text="${admin.nome}">Admin</span>
            </span>
            <a th:href="@{/logout}"
               class="bg-plum hover:bg-white hover:text-eggplant text-white text-sm font-semibold px-4 py-2 rounded-md transition-colors">
                Sair
            </a>
        </div>
    </nav>

    <!-- Conteúdo -->
    <main class="max-w-5xl mx-auto px-4 py-10">
        <h1 class="text-2xl font-bold text-eggplant mb-6">Painel do Administrador</h1>

        <div class="bg-white rounded-2xl shadow-md overflow-hidden">
            <table class="w-full text-sm text-left">
                <thead class="bg-plum text-white">
                    <tr>
                        <th class="px-4 py-3">ID</th>
                        <th class="px-4 py-3">Nome</th>
                        <th class="px-4 py-3">Papel</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="correntista : ${correntistas}" class="border-b border-olive/20 hover:bg-sage/10">
                        <td class="px-4 py-3 text-taupe" th:text="${correntista.id}">1</td>
                        <td class="px-4 py-3 text-taupe" th:text="${correntista.nome}">Nome</td>
                        <td class="px-4 py-3">
                            <span th:if="${correntista.admin}"
                                  class="text-xs font-semibold bg-sage/30 text-eggplant px-2 py-1 rounded-full">
                                Administrador
                            </span>
                            <span th:unless="${correntista.admin}" class="text-xs text-taupe">
                                Correntista
                            </span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(correntistas)}">
                        <td colspan="3" class="px-4 py-6 text-center text-taupe">
                            Nenhum correntista cadastrado.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

</body>
</html>
