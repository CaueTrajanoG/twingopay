<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/principal}">
<body>
    <main layout:fragment="conteudo" class="max-w-5xl mx-auto px-4 py-10">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-eggplant">Painel do Administrador</h1>

            <a th:href="@{/admin/correntistas/novo}"
                class="bg-eggplant hover:bg-plum text-white text-sm font-semibold px-4 py-2 rounded-md transition-colors">
                + Cadastrar Correntista
            </a>
        </div>

        <div class="bg-white rounded-2xl shadow-md overflow-hidden">
            <table class="w-full text-sm text-left">
                <thead class="bg-plum text-white">
                    <tr>
                        <th class="px-4 py-3">ID</th>
                        <th class="px-4 py-3">Usuário</th>
                        <th class="px-4 py-3">Papel</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="correntista : ${correntistas}" class="border-b border-olive/20 hover:bg-sage/10">
                        <td class="px-4 py-3 text-taupe" th:text="${correntista.id}">1</td>
                        <td class="px-4 py-3 text-taupe" th:text="${correntista.username}">Usuário</td>
                        <td class="px-4 py-3">
                            <span th:if="${correntista.admin}"
                                class="text-xs font-semibold bg-sage/30 text-eggplant px-2 py-1 rounded-full">
                                Administrador
                            </span>
                            <span th:unless="${correntista.admin}" class="text-xs text-taupe">
                                Correntista
                            </span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(correntistas)}">
                        <td colspan="3" class="px-4 py-6 text-center text-taupe">
                            Nenhum correntista cadastrado.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
