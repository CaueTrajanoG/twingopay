<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Erro')}"></head>

<body
    class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-sage via-taupe to-eggplant px-4 py-10">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 text-center">
        <p class="text-5xl font-bold text-eggplant mb-2" th:text="${status}">500</p>
        <h1 class="text-xl font-bold text-plum mb-3"
            th:text="${status == 404} ? 'Página não encontrada' : (${status == 403} ? 'Acesso negado' : (${status == 400} ? 'Requisição inválida' : 'Algo deu errado'))">
            Algo deu errado
        </h1>
        <p class="text-sm text-taupe mb-4"
           th:text="${message != null and !#strings.isEmpty(message)} ? ${message} : 'Não foi possível concluir a operação. Tente novamente.'">
            Mensagem
        </p>
        <p th:if="${path != null}" class="text-xs text-taupe/70">Endereço: <span th:text="${path}">/exemplo</span></p>
        <p th:if="${timestamp != null}" class="text-xs text-taupe/70 mb-6">Momento: <span th:text="${timestamp}">agora</span></p>
        <a th:href="@{/correntistas/list}"
           class="inline-block bg-eggplant hover:bg-plum text-white text-sm font-semibold px-5 py-2.5 rounded-md transition-colors">
            Voltar ao início
        </a>
    </div>
</body>

</html>
