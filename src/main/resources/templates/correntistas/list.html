<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{/layouts/principal}">

<body>
    <main layout:fragment="conteudo" class="max-w-5xl mx-auto px-4 py-10">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-eggplant">Minhas Contas</h1>

            <a th:href="@{/correntistas/contas/novaConta}"
                class="bg-eggplant hover:bg-plum text-white text-sm font-semibold px-4 py-2 rounded-md transition-colors">
                + Nova Conta
            </a>
        </div>
        <div class="bg-white rounded-2xl shadow-md overflow-hidden">
            <table class="w-full text-sm text-left">
                <thead class="bg-plum text-white">
                    <tr>
                        <th class="px-4 py-3">Número</th>
                        <th class="px-4 py-3">Descrição</th>
                        <th class="px-4 py-3">Tipo</th>
                        <th class="px-4 py-3">Dia de Fechamento</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="conta : ${contas}"
                        th:onclick="'window.location=\'' + @{'/correntistas/contas/' + ${conta.id}} + '\''"
                        class="border-b border-olive/20 hover:bg-sage/10 cursor-pointer">
                        <td class="px-4 py-3 text-taupe" th:text="${conta.numero}">0001</td>
                        <td class="px-4 py-3 text-taupe" th:text="${conta.descricao}">Descrição</td>
                        <td class="px-4 py-3">
                            <span th:if="${conta.tipo.name() == 'CARTAO'}"
                                class="text-xs font-semibold bg-sage/30 text-eggplant px-2 py-1 rounded-full">
                                Cartão
                            </span>
                            <span th:unless="${conta.tipo.name() == 'CARTAO'}"
                                class="text-xs font-semibold bg-olive/20 text-plum px-2 py-1 rounded-full">
                                Corrente
                            </span>
                        </td>
                        <td class="px-4 py-3 text-taupe">
                            <span th:if="${conta.tipo.name() == 'CARTAO'}" th:text="${conta.diaFechamento}">10</span>
                            <span th:unless="${conta.tipo.name() == 'CARTAO'}">-</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(contas)}">
                        <td colspan="5" class="px-4 py-6 text-center text-taupe">
                            Você ainda não tem nenhuma conta cadastrada.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>

</html>
