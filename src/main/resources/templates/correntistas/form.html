<!DOCTYPE html>
<html lang="en" xmlns="[http://www.thymeleaf.org]">

<head>
    <meta charset="UTF-8">
    <title>Twingopay - Criar conta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: '#A3C68C',
                        olive: '#879676',
                        taupe: '#6E6662',
                        plum: '#4F364A',
                        eggplant: '#340735',
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-gray-50">
    <!-- Navbar -->
    <nav class="bg-eggplant text-white px-6 py-4 flex items-center justify-between">
        <a th:href="@{/login}" class="text-lg font-bold tracking-wide hover:text-sage transition-colors">
            Twingopay
        </a>

        <div class="flex items-center gap-4">  
            <a th:href="@{/logout}"
                class="bg-plum hover:bg-white hover:text-eggplant text-white text-sm font-semibold px-4 py-2 rounded-md transition-colors">
                Sair
            </a>
        </div>
    </nav>
</body>

</html>
