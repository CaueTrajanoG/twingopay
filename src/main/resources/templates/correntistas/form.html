<!DOCTYPE html>
<html lang="en" xmlns="[http://www.thymeleaf.org]">

<head>
    <meta charset="UTF-8">
    <title>Twingopay - Criar conta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: '#A3C68C',
                        olive: '#879676',
                        taupe: '#6E6662',
                        plum: '#4F364A',
                        eggplant: '#340735',
                    }
                }
            }
        }
    </script>
</head>

<body
    class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-sage via-taupe to-eggplant px-4 py-10">
    <p class="text-white/70 text-xs mb-8 text-center">Twingopay &mdash; controle financeiro pessoal</p>

    <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-8">
        <h1 class="text-2xl font-bold text-eggplant text-center mb-6">Criar conta</h1>

        <div th:if="${mensagem}"
            class="bg-red-50 text-red-700 border border-red-200 text-sm rounded-md px-3 py-2 mb-4 text-center">
            <span th:text="${mensagem}">Mensagem de erro</span>
        </div>

        <form th:action="@{/correntistas/criarCorrentista}" th:object="${correntista}" method="post" class="space-y-5">

            <div>
                <label for="nome" class="block text-sm font-semibold text-plum mb-1">
                    Nome completo <span class="text-eggplant">*</span>
                </label>
                <input type="text" id="nome" th:field="*{nome}" placeholder="Digite seu nome" required
                    class="w-full border border-olive/50 rounded-md px-3 py-2 text-sm text-taupe placeholder-taupe/40 focus:outline-none focus:ring-2 focus:ring-eggplant focus:border-eggplant">
                <p class="text-xs text-red-600 mt-1" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">
                    Erro no nome
                </p>
            </div>

            <div>
                <label for="senha" class="block text-sm font-semibold text-plum mb-1">
                    Senha <span class="text-eggplant">*</span>
                </label>
                <input type="password" id="senha" th:field="*{senha}" placeholder="Crie uma senha" required
                    class="w-full border border-olive/50 rounded-md px-3 py-2 text-sm text-taupe placeholder-taupe/40 focus:outline-none focus:ring-2 focus:ring-eggplant focus:border-eggplant">
                <p class="text-xs text-red-600 mt-1" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}">
                    Erro na senha
                </p>
            </div>

            <div>
                <label for="confirmarSenha" class="block text-sm font-semibold text-plum mb-1">
                    Confirmar senha <span class="text-eggplant">*</span>
                </label>
                <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita a senha" required
                    class="w-full border border-olive/50 rounded-md px-3 py-2 text-sm text-taupe placeholder-taupe/40 focus:outline-none focus:ring-2 focus:ring-eggplant focus:border-eggplant">
                <p id="erro-confirmacao" class="text-xs text-red-600 mt-1 hidden">As senhas não coincidem</p>
            </div>

            <button type="submit"
                class="w-full bg-eggplant hover:bg-plum text-white font-semibold py-2.5 rounded-md transition-colors">
                Cadastrar
            </button>
        </form>

        <div class="text-center mt-6">
            <a th:href="@{/correntistas/login}" class="block text-sm text-plum hover:text-eggplant hover:underline">
                Já tem conta? Entrar
            </a>
        </div>
    </div>

    <!--evita o envio quando as senhas não batem -->
    <script>
        document.querySelector('form').addEventListener('submit', function (event) {
            var senha = document.getElementById('senha').value;
            var confirmar = document.getElementById('confirmarSenha').value;
            var aviso = document.getElementById('erro-confirmacao');
            if (senha !== confirmar) {
                event.preventDefault();
                aviso.classList.remove('hidden');
            } else {
                aviso.classList.add('hidden');
            }
        });
    </script>

</body>

</html>
