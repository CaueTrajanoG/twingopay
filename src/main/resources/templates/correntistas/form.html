<!DOCTYPE html>
<html lang="en" xmlns="[http://www.thymeleaf.org]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Correntista</title>
</head>
<body>
    <form th:action="@{/correntistas/save}" method="POST" th:object="${correntista}">
        <input type="hidden" th:field="*{id}"/>
        <label for="correntista">Nome</label>
        <input type="text" th:field="*{nome}"/>
        <label for="item">Senha</label>
        <input type="password" th:field="*{senha}"/>
        <label for="item">Admin:</label>
        <input type="checkbox" th:field="*{admin}"/>

        <button type="submit">Cadastrar correntista</button>
    </form>
</body>
</html>
