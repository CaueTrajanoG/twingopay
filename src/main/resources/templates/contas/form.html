<!DOCTYPE html>
<html lang="en" xmlns="[http://www.thymeleaf.org]">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova conta</title>
</head>

<body>
    <h1 th:text="${conta.id == null ? 'Cadastro de conta' : 'Edição de conta'}">Cadastro de itens</h1>

    <table border="1">
        <thead>
            <th>Nome do correntista</th>
        </thead>
        <tbody>
            <tr th:each="correntista : ${correntistas}">
                <td th:text="${correntista.nome}"></td>
            </tr>
        </tbody>
    </table>
    <a href="/twingopay/">Cadastrar</a>
</body>

</html>
