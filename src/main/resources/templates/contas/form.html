<!DOCTYPE html>
<html lang="en" xmlns="[http://www.thymeleaf.org]">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova conta</title>
</head>

<body>
    <h1 th:text="${conta.id == null ? 'Cadastro de conta' : 'Edição de conta'}">Cadastro de itens</h1>

    <form th:action="@{/contas/save}" method="POST" th:object="${conta}">
        <input type="hidden" th:field="*{id}" />

        <label for="numero">Número</label>
        <input type="text" id="numero" th:field="*{numero}" /><br /><br />

        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" th:field="*{descricao}" /><br /><br />

        <label for="tipo">Tipo de conta</label>
        <select id="tipo" th:field="*{tipo}">
            <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
        </select><br /><br />

        <label for="diaFechamento">Dia de fechamento</label>
        <input type="number" id="diaFechamento" th:field="*{diaFechamento}" min="1" max="31" /><br /><br />

        <label for="correntista">Correntista responsável</label>
        <select id="correntista" th:field="*{correntista}">
            <option th:each="c : ${correntistas}" th:value="${c.id}" th:text="${c.nome}"></option>
        </select><br /><br />

        <button type="submit">Enviar</button>
    </form>
</body>

</html>
