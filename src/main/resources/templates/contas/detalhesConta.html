<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Twingopay - Detalhes da Conta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: '#A3C68C',
                        olive: '#879676',
                        taupe: '#6E6662',
                        plum: '#4F364A',
                        eggplant: '#340735',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gray-50">

    <!-- Navbar -->
    <nav class="bg-eggplant text-white px-6 py-4 flex items-center justify-between">
        <a th:href="@{/login}" class="text-lg font-bold tracking-wide hover:text-sage transition-colors">
            Twingopay
        </a>

        <div class="flex items-center gap-4">
            <span class="text-sm text-white/80">
                Olá, <span class="font-semibold text-white" th:text="${session.correntistaLogado.nome}">Correntista</span>
            </span>
            <a th:href="@{/logout}"
               class="bg-plum hover:bg-white hover:text-eggplant text-white text-sm font-semibold px-4 py-2 rounded-md transition-colors">
                Sair
            </a>
        </div>
    </nav>

    <!-- Conteúdo -->
    <main class="max-w-2xl mx-auto px-4 py-10">

        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-eggplant">Detalhes da Conta</h1>
            <a th:href="@{/correntistas/list}" class="text-sm text-plum hover:text-eggplant hover:underline">
                &larr; Voltar às minhas contas
            </a>
        </div>

        <div class="bg-white rounded-2xl shadow-md p-8 space-y-6">

            <div class="flex items-center justify-between border-b border-olive/20 pb-4">
                <div>
                    <p class="text-xs uppercase tracking-wide text-taupe/70">Número da conta</p>
                    <p class="text-xl font-bold text-eggplant" th:text="${conta.numero}">0001</p>
                </div>
                <span th:if="${conta.tipo.name() == 'CARTAO'}"
                      class="text-xs font-semibold bg-sage/30 text-eggplant px-3 py-1 rounded-full">
                    Cartão
                </span>
                <span th:unless="${conta.tipo.name() == 'CARTAO'}"
                      class="text-xs font-semibold bg-olive/20 text-plum px-3 py-1 rounded-full">
                    Corrente
                </span>
            </div>

            <!-- Detalhes -->
            <dl class="space-y-4">
                <div class="flex items-center justify-between">
                    <dt class="text-sm font-semibold text-plum">Descrição</dt>
                    <dd class="text-sm text-taupe" th:text="${conta.descricao}">Descrição da conta</dd>
                </div>

                <div class="flex items-center justify-between">
                    <dt class="text-sm font-semibold text-plum">Tipo</dt>
                    <dd class="text-sm text-taupe">
                        <span th:if="${conta.tipo.name() == 'CARTAO'}">Cartão de crédito</span>
                        <span th:unless="${conta.tipo.name() == 'CARTAO'}">Conta corrente</span>
                    </dd>
                </div>

                <div th:if="${conta.tipo.name() == 'CARTAO'}" class="flex items-center justify-between">
                    <dt class="text-sm font-semibold text-plum">Dia de fechamento</dt>
                    <dd class="text-sm text-taupe" th:text="${conta.diaFechamento}">10</dd>
                </div>

                <div class="flex items-center justify-between">
                    <dt class="text-sm font-semibold text-plum">Titular</dt>
                    <dd class="text-sm text-taupe" th:text="${conta.correntista.nome}">Nome</dd>
                </div>
            </dl>
        </div>

        <!-- Botão de Nova Transação -->
            <div class="flex justify-end">
                <a th:href="@{/transacoes/nova(contaId=${conta.id})}"
                   class="bg-eggplant hover:bg-plum text-white text-sm font-semibold px-4 py-2 rounded-md transition-colors">
                    + Nova Transação
                </a>
        </div>
    </main>

</body>
</html>
