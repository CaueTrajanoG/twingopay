<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Twingopay - Transação</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: '#A3C68C',
                        olive: '#879676',
                        taupe: '#6E6662',
                        plum: '#4F364A',
                        eggplant: '#340735',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gray-50">
    <nav class="bg-eggplant text-white px-6 py-4 flex items-center justify-between">
        <a th:href="@{/correntistas/list}" class="text-lg font-bold tracking-wide hover:text-sage transition-colors">
            Twingopay
        </a>
        <div class="flex items-center gap-4">
            <span class="text-sm text-white/80">
                Olá, <span class="font-semibold text-white" th:text="${session.correntistaLogado.nome}">Correntista</span>
            </span>
            <a th:href="@{/logout}"
               class="bg-plum hover:bg-white hover:text-eggplant text-white text-sm font-semibold px-4 py-2 rounded-md transition-colors">
                Sair
            </a>
        </div>
    </nav>

    <main class="max-w-md mx-auto px-4 py-10">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-eggplant" th:text="${transacao.id == null ? 'Nova Transação' : 'Editar Transação'}">Transação</h1>
            <a th:href="@{/correntistas/contas/{id}(id=${conta.id})}" class="text-sm text-plum hover:text-eggplant hover:underline">
                Voltar para a conta
            </a>
        </div>

        <div class="bg-white rounded-2xl shadow-md p-8">
            <form th:action="@{/transacoes/salvar}" th:object="${transacao}" method="post" class="space-y-5">
                
                <!-- Campo oculto para o ID (essencial para o Spring identificar que é uma atualização/edição) -->
                <input type="hidden" th:field="*{id}" />

                <!-- Campo oculto para vincular a transação à conta correta -->
                <input type="hidden" th:field="*{conta.id}" />

                <div>
                    <label for="data" class="block text-sm font-semibold text-plum mb-1">Data</label>
                    <input type="date" id="data" th:field="*{data}" required
                           class="w-full border border-olive/50 rounded-md px-3 py-2 text-sm text-taupe focus:outline-none focus:ring-2 focus:ring-eggplant focus:border-eggplant">
                </div>

                <div>
                    <label for="descricao" class="block text-sm font-semibold text-plum mb-1">Descrição</label>
                    <input type="text" id="descricao" th:field="*{descricao}" placeholder="Ex: Pagamento da faculdade" required
                           class="w-full border border-olive/50 rounded-md px-3 py-2 text-sm text-taupe focus:outline-none focus:ring-2 focus:ring-eggplant focus:border-eggplant">
                </div>

                <div>
                    <label for="valor" class="block text-sm font-semibold text-plum mb-1">Valor (R$)</label>
                    <input type="number" id="valor" th:field="*{valor}" step="0.01" min="0.01" placeholder="0,00" required
                           class="w-full border border-olive/50 rounded-md px-3 py-2 text-sm text-taupe focus:outline-none focus:ring-2 focus:ring-eggplant focus:border-eggplant">
                </div>

                <div>
                    <label for="movimento" class="block text-sm font-semibold text-plum mb-1">Movimento</label>
                    <select id="movimento" th:field="*{movimento}" required
                            class="w-full border border-olive/50 rounded-md px-3 py-2 text-sm text-taupe focus:outline-none focus:ring-2 focus:ring-eggplant focus:border-eggplant">
                        <option value="" disabled selected>Selecione</option>
                        <option th:each="mov : ${movimentos}" th:value="${mov}" th:text="${mov}"></option>
                    </select>
                </div>

                <div>
                    <label for="categoria" class="block text-sm font-semibold text-plum mb-1">Categoria</label>
                    <select id="categoria" th:field="*{categoria}" required
                            class="w-full border border-olive/50 rounded-md px-3 py-2 text-sm text-taupe focus:outline-none focus:ring-2 focus:ring-eggplant focus:border-eggplant">
                        <option value="" disabled selected>Selecione</option>
                        <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}"></option>
                    </select>
                </div>

                <button type="submit"
                        class="w-full bg-eggplant hover:bg-plum text-white font-semibold py-2.5 rounded-md transition-colors mt-4">
                    Salvar Transação
                </button>
            </form>
        </div>
    </main>
</body>
</html>
